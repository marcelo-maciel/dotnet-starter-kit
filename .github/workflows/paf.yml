name: PAF CI

# PAF pipeline (O08, RNF16, RNF17). New file listed in ADR 0008 ("Workflow de CI do PAF"); the kit's workflows
# stay untouched and only run on main. Every job here is required: the "PAF CI" job fails on any failure,
# cancellation or skip, so a commit with a red test or a walk with one FAIL never shows green.
#
# Promotion: push to main -> CI -> deploy-homologacao (environment "homologacao"). Production is manual
# (workflow_dispatch with the SHA): the green-in-homologação gate runs BEFORE the "producao" environment asks
# for approval, so a SHA that never went green fails without bothering the reviewer. Production deploys the
# images already pushed for that SHA (same artifact that passed homologação, never a rebuild).
#
# Setup outside this file (repository settings, not code): secret PAF_SENHA_DEMO; environments "homologacao"
# and "producao" (required reviewer on producao), each with PAF_SSH_HOST, PAF_SSH_USUARIO, PAF_SSH_CHAVE,
# PAF_SSH_KNOWN_HOSTS and PAF_DIR_HOST; docker login to ghcr.io on the host. See deploy/paf/README.md.

on:
  push:
    branches: [main, 'feat/**']
  # No branch filter: PAF pull requests target feature branches, not main.
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA completo (40 hex) já verde em homologação, para promover à produção'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  backend:
    name: Backend PAF
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # NuGetAudit=false: pre-existing audit failure of the kit's package set, tracked outside the PAF; the
      # kit's own backend.yml still audits on main.
      - name: Restore
        run: dotnet restore src/FSH.Starter.slnx -p:NuGetAudit=false

      - name: Build
        run: dotnet build src/FSH.Starter.slnx -c Release --no-restore -p:NuGetAudit=false

      - name: Architecture.Tests
        run: dotnet test src/Tests/Architecture.Tests -c Release --no-build --logger "trx;LogFileName=Architecture.trx" --results-directory ./TestResults

      - name: PAF.Tests
        run: dotnet test src/Tests/PAF.Tests -c Release --no-build --logger "trx;LogFileName=PAF.trx" --results-directory ./TestResults

      # Own process: one Kestrel host per process (CONTEXT.md, O16).
      - name: PAF.Kestrel.Tests
        run: dotnet test src/Tests/PAF.Kestrel.Tests -c Release --no-build --logger "trx;LogFileName=PAF.Kestrel.trx" --results-directory ./TestResults

      # Testcontainers: ubuntu-latest ships Docker.
      - name: Integration.Tests (PAF)
        run: dotnet test src/Tests/Integration.Tests -c Release --no-build --filter "FullyQualifiedName~Paf" --logger "trx;LogFileName=Integration.PAF.trx" --results-directory ./TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paf-test-results
          path: ./TestResults/*.trx
          retention-days: 7

  dashboard:
    name: Dashboard PAF
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/dashboard
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/dashboard/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `build` is `tsc -b && vite build`.
      - name: Build
        run: npm run build

      # D21: node --test with Node 22 type stripping; the alias hook lets the menu test load the kit's "@/" modules.
      - name: Testes unitários do PAF
        run: node --import ./src/features/paf/navegacao/resolver-alias.mjs --test "src/features/paf/**/*.test.ts"

  scripts:
    name: Scripts de implantação
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate de homologação verde
        run: node --test deploy/paf/exigir-homologacao-verde.test.mjs

      - name: Caminhos de falha dos scripts de CI
        run: bash deploy/paf/scripts-ci.test.sh

      - name: Invariantes de ambiente
        run: bash deploy/paf/verificar-ambiente.test.sh

  walk:
    name: Walk no Chrome
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAF_SENHA_DEMO: ${{ secrets.PAF_SENHA_DEMO }}
    steps:
      - uses: actions/checkout@v6

      - name: Exigir segredo do walk
        run: bash deploy/paf/exigir-segredos.sh PAF_SENHA_DEMO

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/dashboard/package-lock.json

      - name: npm ci
        working-directory: clients/dashboard
        run: npm ci

      # The walk launches channel "chrome": the runner image's Google Chrome, never a downloaded Chromium.
      - name: Google Chrome presente
        run: google-chrome --version

      - name: Walk da primeira fatia
        run: bash deploy/paf/walk-ci.sh

  paf-ci:
    name: PAF CI
    needs: [backend, dashboard, scripts, walk]
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Falhar se algum job do PAF não passou
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::Um job obrigatório do PAF falhou, foi cancelado ou pulado."
          exit 1
      - run: echo "PAF CI verde."

  deploy-homologacao:
    name: Deploy homologação
    needs: [paf-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: homologacao
    concurrency:
      group: paf-deploy-homologacao
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      PAF_SSH_HOST: ${{ secrets.PAF_SSH_HOST }}
      PAF_SSH_USUARIO: ${{ secrets.PAF_SSH_USUARIO }}
      PAF_SSH_CHAVE: ${{ secrets.PAF_SSH_CHAVE }}
      PAF_SSH_KNOWN_HOSTS: ${{ secrets.PAF_SSH_KNOWN_HOSTS }}
      PAF_DIR_HOST: ${{ secrets.PAF_DIR_HOST }}
      PAF_REGISTRO: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v6

      # Fail before spending the image build: secrets present and deploy.sh (O06) in the tree.
      - name: Exigir segredos e deploy.sh
        run: |
          bash deploy/paf/exigir-segredos.sh PAF_SSH_HOST PAF_SSH_USUARIO PAF_SSH_CHAVE PAF_SSH_KNOWN_HOSTS PAF_DIR_HOST
          test -f deploy/paf/deploy.sh || { echo "::error::deploy/paf/deploy.sh ausente (tarefa O06)"; exit 1; }

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images built once, tagged with the full SHA; production later pulls these same tags.
      - name: Publicar imagens
        run: |
          set -euo pipefail
          REGISTRO="${PAF_REGISTRO,,}"
          deploy/paf/publicar-imagem-api.sh "$GITHUB_SHA"
          deploy/paf/publicar-imagem-migrator.sh "$GITHUB_SHA"
          docker build -t "paf-dashboard:$GITHUB_SHA" clients/dashboard
          docker build -t "paf-admin:$GITHUB_SHA" clients/admin
          for imagem in paf-api paf-dbmigrator paf-dashboard paf-admin; do
            docker tag "$imagem:$GITHUB_SHA" "$REGISTRO/$imagem:$GITHUB_SHA"
            docker push "$REGISTRO/$imagem:$GITHUB_SHA"
          done

      # Secrets checked, deploy.sh (O06) required and SSH bounded inside the script, before the first connection.
      - name: Implantar
        run: bash deploy/paf/implantar-remoto.sh homologacao "$GITHUB_SHA"

  exigir-homologacao-verde:
    name: Exigir SHA verde em homologação
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Exigir main
        run: test "$GITHUB_REF" = refs/heads/main || { echo "::error::produção só a partir de main"; exit 1; }

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir implantação verde
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA_PRODUCAO: ${{ inputs.sha }}
        run: node deploy/paf/exigir-homologacao-verde.mjs "$SHA_PRODUCAO"

  deploy-producao:
    name: Deploy produção
    needs: [exigir-homologacao-verde]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: producao
    concurrency:
      group: paf-deploy-producao
      cancel-in-progress: false
    env:
      PAF_SSH_HOST: ${{ secrets.PAF_SSH_HOST }}
      PAF_SSH_USUARIO: ${{ secrets.PAF_SSH_USUARIO }}
      PAF_SSH_CHAVE: ${{ secrets.PAF_SSH_CHAVE }}
      PAF_SSH_KNOWN_HOSTS: ${{ secrets.PAF_SSH_KNOWN_HOSTS }}
      PAF_DIR_HOST: ${{ secrets.PAF_DIR_HOST }}
      PAF_REGISTRO: ghcr.io/${{ github.repository_owner }}
      SHA_PRODUCAO: ${{ inputs.sha }}
    steps:
      # The deploy scripts of the promoted SHA, not of whatever main is now.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      # Secrets checked, deploy.sh (O06) required and SSH bounded inside the script, before the first connection.
      - name: Implantar
        run: bash deploy/paf/implantar-remoto.sh producao "$SHA_PRODUCAO"
