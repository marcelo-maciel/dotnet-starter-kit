server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Long-lived caching for hashed asset bundles
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Runtime config — must be re-fetched on every deploy
  location = /config.json {
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA fallback with security headers
  location / {
    try_files $uri /index.html;
    # index.html names the hashed bundle of the current deploy. Without a Cache-Control the browser caches it
    # heuristically and keeps running the previous release after a deploy; no-cache makes it revalidate (a cheap
    # 304 when nothing changed). The hashed assets above keep their 1-year immutable cache.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp.conf;
  }

  # Block dotfiles
  location ~ /\. {
    deny all;
  }
}
