server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /config.json {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff";
  }

  location / {
    try_files $uri /index.html;
    # index.html names the hashed bundle of the current deploy. Without a Cache-Control the browser caches it
    # heuristically and keeps running the previous release after a deploy; no-cache makes it revalidate (a cheap
    # 304 when nothing changed). The hashed assets above keep their 1-year immutable cache.
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
  }

  location ~ /\. {
    deny all;
  }
}
