# Included by every location: nginx drops the server-level add_header directives of a location that declares its
# own, so each location restates them through this one file.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# TLS ends at the Cloudflare edge, which forwards only https, so the header is safe to send from here. No
# includeSubDomains: the parent domain serves other systems this app does not own.
add_header Strict-Transport-Security "max-age=31536000" always;
# Nothing here uses the camera, the microphone or the location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
